<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JNet - Республика Жакид</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1e;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #0f6e6e, #0a5a5a);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .header h1 { font-size: 1.1rem; }
        .back-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; display: none; }
        .menu-btn { background: none; border: none; color: white; font-size: 1.3rem; cursor: pointer; }
        .status-bar {
            background: #0f1420;
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #aaa;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }
        .message-own { align-self: flex-end; background: #0f6e6e; color: white; border-bottom-right-radius: 5px; }
        .message-other { align-self: flex-start; background: #2a2f40; color: #e0e0e0; border-bottom-left-radius: 5px; cursor: pointer; }
        .message-sender { font-size: 0.65rem; opacity: 0.8; margin-bottom: 4px; }
        .message-text { font-size: 0.9rem; line-height: 1.4; }
        .message-time { font-size: 0.55rem; opacity: 0.5; margin-top: 4px; }
        .reply-badge {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.15);
            padding: 4px 8px;
            border-radius: 12px;
            margin-bottom: 6px;
            display: inline-block;
        }
        .input-area {
            padding: 12px;
            display: flex;
            gap: 8px;
            background: #0f1420;
            border-top: 1px solid #2a2f40;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: #2a2f40;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .input-area button {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: #0f6e6e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .reply-preview {
            background: #1a2a2a;
            padding: 8px 12px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
        }
        .cancel-reply { background: none; border: none; color: #ff8888; cursor: pointer; }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #1a1f2e;
            z-index: 200;
            transition: left 0.3s;
            display: flex;
            flex-direction: column;
        }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 20px; background: #0f6e6e; color: white; }
        .sidebar-item {
            padding: 15px 20px;
            border-bottom: 1px solid #2a2f40;
            cursor: pointer;
        }
        .sidebar-item:hover { background: #2a2f40; }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            display: none;
        }
        .overlay.show { display: block; }
        .online-count { color: #00ffcc; }
        .online-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            cursor: pointer;
            border-radius: 10px;
        }
        .online-user:hover { background: #2a2f40; }
        .online-user.active { background: #0f6e6e; }
        .user-status { width: 8px; height: 8px; border-radius: 50%; background: #00ff00; }
        @media (min-width: 768px) {
            .menu-btn { display: none; }
            .sidebar { position: relative; left: 0; width: 260px; }
            .overlay { display: none !important; }
            .back-btn { display: inline-block; }
        }
        @media (max-width: 767px) {
            .sidebar:not(.open) { display: none; }
            .back-btn { display: inline-block; }
        }
    </style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <strong>🇯🇴 JNet</strong>
        <div id="myInfo" style="font-size:0.7rem; margin-top:5px;"></div>
    </div>
    <div class="sidebar-item" onclick="switchToGlobal(); closeSidebar();">🌍 Общий чат</div>
    <div class="sidebar-item" style="opacity:0.7;">👥 Онлайн</div>
    <div id="onlineList" style="padding:10px; max-height:300px; overflow-y:auto;"></div>
    <div class="sidebar-item" onclick="openNameModal(); closeSidebar();">✏️ Сменить имя</div>
</div>

<div class="main-chat" style="flex:1; display:flex; flex-direction:column; height:100vh;">
    <div class="header">
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <button class="back-btn" id="backBtn" onclick="switchToGlobal()" style="display:none;">←</button>
            <h1 id="chatTitle">🌍 Общий чат</h1>
        </div>
        <div></div>
    </div>
    <div class="status-bar">
        <span>🇯🇴 JNet</span>
        <span class="online-count" id="onlineCount">🖧 Онлайн: 0</span>
    </div>
    <div class="messages" id="messages"></div>
    <div id="replyPreview" class="reply-preview" style="display: none;">
        <span>📎 Ответ на: <span id="replyText"></span></span>
        <button class="cancel-reply" onclick="cancelReply()">✖</button>
    </div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">📡</button>
    </div>
</div>

<div id="nameModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:300;">
    <div style="background:#1a1f2e; padding:20px; border-radius:20px; width:90%; max-width:320px;">
        <h3>Сменить имя</h3>
        <input type="text" id="newName" placeholder="Новое имя" style="width:100%; padding:10px; margin:10px 0; border-radius:10px; background:#2a2f40; color:white; border:none;">
        <button onclick="changeName()" style="background:#0f6e6e; color:white; padding:10px 20px; border:none; border-radius:10px;">Сохранить</button>
        <button onclick="closeModal()" style="margin-left:10px; padding:10px 20px;">Отмена</button>
    </div>
</div>

<script>
    const FIREBASE_URL = "https://jnet-3359c-default-rtdb.firebaseio.com/";
    
    let myId = localStorage.getItem('jnet_id');
    if (!myId) {
        myId = "JAK-" + Math.floor(Math.random() * 9000 + 1000);
        localStorage.setItem('jnet_id', myId);
    }
    let myName = localStorage.getItem('jnet_name') || myId;
    
    let currentChat = 'global';
    let currentChatName = 'Общий чат';
    let replyTo = null;
    let processedMessages = new Set();
    let messagesCache = [];
    
    document.getElementById("myInfo").innerHTML = `${myName}<br>${myId}`;
    
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
        document.getElementById("overlay").classList.toggle("show");
    }
    function closeSidebar() {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("overlay").classList.remove("show");
    }
    function closeModal() {
        document.getElementById("nameModal").style.display = "none";
    }
    function openNameModal() {
        document.getElementById("newName").value = myName;
        document.getElementById("nameModal").style.display = "flex";
    }
    
    async function register() {
        try {
            await fetch(`${FIREBASE_URL}peers/${myId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: myId, name: myName, last_seen: Date.now() / 1000 })
            });
        } catch(e) {}
    }
    
    async function updateOnline() {
        try {
            const resp = await fetch(`${FIREBASE_URL}peers.json`);
            const peers = await resp.json() || {};
            let online = [];
            for (let id in peers) {
                if (id !== myId && (Date.now()/1000 - peers[id].last_seen) < 60) {
                    online.push({ id, name: peers[id].name || id });
                }
            }
            document.getElementById("onlineCount").innerHTML = `🖧 Онлайн: ${online.length}`;
            
            let html = '';
            for (let u of online) {
                const active = (currentChat === u.id) ? 'active' : '';
                html += `<div class="online-user ${active}" onclick="switchToDM('${u.id}', '${u.name.replace(/'/g, "\\'")}')">
                    <div class="user-status"></div>
                    <div class="user-name">${escapeHtml(u.name)}</div>
                </div>`;
            }
            document.getElementById("onlineList").innerHTML = html || '<div>🤷‍♂️ Никого нет</div>';
        } catch(e) {}
        setTimeout(updateOnline, 10000);
    }
    
    function switchToGlobal() {
        currentChat = 'global';
        currentChatName = 'Общий чат';
        document.getElementById("chatTitle").innerHTML = '🌍 Общий чат';
        document.getElementById("backBtn").style.display = 'none';
        document.getElementById("messages").innerHTML = '';
        processedMessages.clear();
        loadMessages();
        closeSidebar();
    }
    
    function switchToDM(userId, userName) {
        currentChat = userId;
        currentChatName = userName;
        document.getElementById("chatTitle").innerHTML = `💬 ${escapeHtml(userName)}`;
        document.getElementById("backBtn").style.display = 'inline-block';
        document.getElementById("messages").innerHTML = '';
        processedMessages.clear();
        loadMessages();
        closeSidebar();
    }
    
    async function sendMessage() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if (!text) return;
        
        let replyData = null;
        if (replyTo) {
            replyData = replyTo;
            cancelReply();
        }
        
        addMessageToScreen(myName, text, true, null);
        input.value = "";
        
        const message = {
            from: myId,
            fromName: myName,
            to: currentChat,
            text: text,
            time: Date.now() / 1000,
            reply: replyData
        };
        
        try {
            await fetch(`${FIREBASE_URL}messages.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(message)
            });
        } catch(e) {}
    }
    
    async function loadMessages() {
        try {
            const resp = await fetch(`${FIREBASE_URL}messages.json`);
            const msgs = await resp.json() || {};
            let relevant = [];
            for (let id in msgs) {
                if (processedMessages.has(id)) continue;
                const msg = msgs[id];
                let isRelevant = false;
                if (currentChat === 'global') {
                    isRelevant = (msg.to === 'global');
                } else {
                    isRelevant = (msg.from === myId && msg.to === currentChat) ||
                                 (msg.from === currentChat && msg.to === myId);
                }
                if (isRelevant && msg.text) relevant.push({ id, ...msg });
            }
            relevant.sort((a, b) => a.time - b.time);
            for (let msg of relevant) {
                const isOwn = msg.from === myId;
                const senderName = isOwn ? myName : (msg.fromName || msg.from);
                addMessageToScreen(senderName, msg.text, isOwn, msg);
                processedMessages.add(msg.id);
                messagesCache.push(msg);
                if (messagesCache.length > 200) messagesCache.shift();
            }
        } catch(e) {}
        setTimeout(loadMessages, 2000);
    }
    
    function addMessageToScreen(senderName, text, isOwn, fullMsg) {
        const container = document.getElementById("messages");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${isOwn ? 'message-own' : 'message-other'}`;
        const time = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
        
        let replyHtml = "";
        if (fullMsg && fullMsg.reply) {
            const rs = fullMsg.reply.senderName || fullMsg.reply.sender;
            replyHtml = `<div class="reply-badge">↩️ Ответ ${rs}: "${fullMsg.reply.text.substring(0, 50)}"</div>`;
        }
        
        msgDiv.innerHTML = `
            <div class="message-sender">${escapeHtml(senderName)}</div>
            ${replyHtml}
            <div class="message-text">${escapeHtml(text)}</div>
            <div class="message-time">${time}</div>
        `;
        
        if (!isOwn && fullMsg && fullMsg.from) {
            msgDiv.onclick = () => setReply(fullMsg);
        }
        
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }
    
    function setReply(msg) {
        if (msg.from === myId) return;
        replyTo = {
            id: msg.id,
            text: msg.text,
            sender: msg.from,
            senderName: msg.fromName || msg.from
        };
        document.getElementById("replyText").innerHTML = `${replyTo.senderName}: "${replyTo.text.substring(0, 50)}"`;
        document.getElementById("replyPreview").style.display = "flex";
    }
    
    function cancelReply() {
        replyTo = null;
        document.getElementById("replyPreview").style.display = "none";
    }
    
    async function changeName() {
        const newName = document.getElementById("newName").value.trim();
        if (newName) {
            myName = newName;
            localStorage.setItem('jnet_name', myName);
            document.getElementById("myInfo").innerHTML = `${myName}<br>${myId}`;
            await register();
            closeModal();
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' })[m]);
    }
    
    window.addEventListener('resize', () => {
        if (window.innerWidth > 767 && currentChat !== 'global') {
            document.getElementById("backBtn").style.display = 'inline-block';
        }
    });
    
    register();
    updateOnline();
    loadMessages();
    setInterval(register, 30000);
</script>
</body>
</html>
